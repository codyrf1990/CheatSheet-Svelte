<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<meta name="theme-color" content="#c8102e" />
		<meta name="description" content="SolidCAM CheatSheet - Package and Panel Selection Tool" />

		     SKU codes and ambiguous words like "Maintenance" / "Module" that
		     exist identically in French. -->

		<link rel="preload" as="image" href="/img/solidcam-logo.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
